<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asternihva — web-adv-engine demo</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./theme.css" />
  </head>
  <body>
    <main id="game" class="game adv-viewport">
      <div id="background" class="background adv-background"></div>
      <div class="shade"></div>
      <header class="brand">
        <span>web-adv-engine / example</span>
        <strong id="title"></strong>
      </header>
      <p id="asset-status" class="asset-status" role="status"></p>
      <div class="stage-window adv-character-layer">
        <section id="stage" class="stage" aria-label="character stage"></section>
      </div>
      <section id="dialogue" class="adv-dialogue">
        <div id="speaker" class="adv-speaker"></div>
        <div id="text" class="adv-text"></div>
        <span id="page-indicator" class="adv-page-indicator" aria-label="ページ送り"></span>
        <div id="choices" class="adv-choices"></div>
      </section>
    </main>
    <script type="module" src="./main.mjs"></script>
  </body>
</html>
