<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asternihva</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./theme.css" />
  </head>
  <body>
    <main id="game" class="game adv-viewport">
      <div id="background" class="background adv-background"></div>
      <div class="shade"></div>
      <header class="brand" data-debug-panel hidden>
        <span>web-adv-engine / example</span>
        <strong id="title"></strong>
      </header>
      <p id="asset-status" class="asset-status" role="status" hidden></p>
      <div class="stage-window adv-character-layer">
        <section id="stage" class="stage" aria-label="character stage"></section>
      </div>
      <section id="dialogue" class="adv-dialogue">
        <div id="speaker" class="adv-speaker"></div>
        <div id="text" class="adv-text" aria-live="polite" aria-atomic="true"></div>
        <span id="page-indicator" class="adv-page-indicator" aria-label="ページ送り"></span>
        <nav id="controls" class="adv-controls" aria-label="ゲーム操作">
          <button class="adv-control" data-control="auto" aria-pressed="false">AUTO</button>
          <button class="adv-control" data-control="skip" aria-pressed="false">SKIP</button>
          <button class="adv-control" data-control="log">LOG</button>
          <button class="adv-control" data-control="menu">MENU</button>
        </nav>
      </section>
      <div id="choices" class="adv-choices" role="group" aria-label="選択肢"></div>
      <dialog id="log-panel" class="adv-panel adv-log-panel" aria-label="会話履歴">
        <header class="adv-panel-header"><h2>LOG</h2><form method="dialog"><button aria-label="履歴を閉じる">閉じる ×</button></form></header>
        <div class="adv-log-content" role="list" aria-label="発言履歴"></div>
      </dialog>
      <dialog id="menu-panel" class="adv-panel" aria-label="メニュー"><h2>MENU</h2><p>クリック・Enterで会話を進めます。AUTOは自動送り、SKIPは早送りです。選択肢は手動で選んでください。</p><button id="restart">最初から</button><form method="dialog"><button>会話へ戻る</button></form></dialog>
    </main>
    <script type="module" src="./main.mjs"></script>
  </body>
</html>
