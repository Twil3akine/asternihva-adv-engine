<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Independent game</title><style>
body{margin:0;background:#121820;color:#f4f6fc;display:grid;place-items:center;min-height:100dvh;font-family:system-ui}
[hidden]{display:none!important}#title{position:absolute;inset:0;z-index:200;background:#18212e;padding:5%}#stage{position:absolute;inset:5% 8% 20%}#toolbar{position:absolute;right:2%;top:2%;z-index:250}button{min-height:44px;padding:8px 16px}#status{position:absolute;z-index:300;top:0}#game{--adv-dialog-height:28%}
</style></head><body><main id="game" class="adv-viewport"><div id="background" class="adv-background"></div><div id="stage" class="adv-character-layer"></div><section id="title"><h1>Independent game</h1><button id="start">Start</button></section><nav id="toolbar" data-adv-interactive><button id="save">Save</button><button id="load">Load</button><button id="advance">Next</button></nav><section id="dialogue" class="adv-dialogue"><b id="speaker" class="adv-speaker"></b><div id="text" class="adv-text"></div></section><div id="choices" class="adv-choices"></div><p id="status" role="status"></p></main><script type="module" src="/main.js"></script></body></html>
